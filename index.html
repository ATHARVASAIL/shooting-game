<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AK Arena</title>
<style>
  :root{
    --bg:#12161c;
    --grid:#1c2530;
    --steel:#c7ced6;
    --brass:#d8a44a;
    --heat:#ff5b3c;
    --cool:#3fb6b2;
    --ink:#e8edf2;
    --muted:#7d8896;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,sans-serif;overflow:hidden;
    -webkit-tap-highlight-color:transparent;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:
    repeating-linear-gradient(0deg,var(--grid) 0 1px,transparent 1px 40px),
    repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 40px),
    var(--bg);
    touch-action:none;cursor:crosshair;box-shadow:0 0 0 1px #000 inset}
  #hud{position:fixed;top:0;left:0;right:0;padding:14px 18px;
    display:flex;justify-content:space-between;align-items:flex-start;
    pointer-events:none;font-variant-numeric:tabular-nums}
  .stat{font-size:13px;color:var(--muted);letter-spacing:.04em}
  .stat b{display:block;font-size:26px;color:var(--ink);font-weight:600;line-height:1.1}
  #score b{color:var(--brass)}
  #wave b{color:var(--cool)}
  #ammoWrap{text-align:right}
  #ammo b{color:var(--steel)}
  #ammo.low b{color:var(--heat)}
  #hpbar{position:fixed;left:18px;bottom:18px;width:190px;height:12px;
    background:#0009;border:1px solid #000;pointer-events:none}
  #hpfill{height:100%;width:100%;background:linear-gradient(90deg,var(--heat),var(--brass));
    transition:width .15s}
  #overlay{position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;gap:18px;
    background:radial-gradient(circle at 50% 40%,#12161cdd,#080a0ef2);z-index:5}
  #overlay h1{font-size:clamp(34px,9vw,64px);font-weight:800;letter-spacing:.02em}
  #overlay h1 span{color:var(--brass)}
  #overlay p{color:var(--muted);max-width:340px;line-height:1.6;font-size:15px}
  #overlay .big{font-size:20px;color:var(--ink)}
  button{pointer-events:auto;background:var(--brass);color:#161009;border:0;
    padding:14px 34px;font-size:17px;font-weight:700;border-radius:2px;
    cursor:pointer;letter-spacing:.03em}
  button:active{transform:translateY(1px)}
  .hidden{display:none!important}
  #hint{position:fixed;bottom:44px;left:50%;transform:translateX(-50%);
    font-size:12px;color:var(--muted);pointer-events:none;text-align:center}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="hud" class="hidden">
  <div id="score" class="stat">SCORE<b>0</b></div>
  <div id="wave" class="stat" style="text-align:center">WAVE<b>1</b></div>
  <div id="ammo" class="stat" style="text-align:right">AMMO<b>30</b></div>
</div>
<div id="hpbar" class="hidden"><div id="hpfill"></div></div>
<div id="hint" class="hidden">MOVE: WASD / drag &nbsp;·&nbsp; AIM+FIRE: mouse / touch &nbsp;·&nbsp; RELOAD: R</div>

<div id="overlay">
  <h1>AK <span>ARENA</span></h1>
  <p class="big">Survive the waves.</p>
  <p>Move with <b>WASD</b> or by dragging. Aim and hold to fire your AK-47. It reloads automatically when empty, or press <b>R</b>.</p>
  <button id="startBtn">START</button>
</div>

<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hud = document.getElementById('hud');
const scoreEl = document.querySelector('#score b');
const waveEl = document.querySelector('#wave b');
const ammoEl = document.querySelector('#ammo b');
const ammoBox = document.getElementById('ammo');
const hpfill = document.getElementById('hpfill');
const hpbar = document.getElementById('hpbar');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const hint = document.getElementById('hint');

// ---- player sprite: replace this file (or the path) with any image you want ----
const PLAYER_IMG_SRC = 'player.png';
const playerImg = new Image();
let playerImgReady = false;
playerImg.onload = ()=> playerImgReady = true;
playerImg.onerror = ()=> playerImgReady = false; // falls back to drawn circle
playerImg.src = PLAYER_IMG_SRC;

// ---- enemy sprite: replace this file (or the path) with any image you want ----
const ENEMY_IMG_SRC = 'enemy.png';
const enemyImg = new Image();
let enemyImgReady = false;
enemyImg.onload = ()=> enemyImgReady = true;
enemyImg.onerror = ()=> enemyImgReady = false; // falls back to drawn circle
enemyImg.src = ENEMY_IMG_SRC;

let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = Math.min(window.innerWidth, 900);
  H = Math.min(window.innerHeight, 620);
  cv.style.width = W + 'px';
  cv.style.height = H + 'px';
  cv.width = W * DPR;
  cv.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

// ---- game state ----
let player, bullets, enemies, particles, keys, mouse;
let score, wave, ammo, magSize, reloading, reloadT, spawnTimer, enemiesLeft;
let running=false, gameTime=0, lastShot=0;

function reset(){
  player = {x:W/2, y:H/2, r:14, hp:100, speed:3.4, angle:0};
  bullets=[]; enemies=[]; particles=[];
  keys={}; mouse={x:W/2, y:0, down:false};
  score=0; wave=0; magSize=30; ammo=magSize;
  reloading=false; reloadT=0; spawnTimer=0; enemiesLeft=0;
  gameTime=0; lastShot=0;
  nextWave();
  updateHUD();
}

function nextWave(){
  wave++;
  enemiesLeft = 4 + wave*2;
  spawnTimer = 0;
}

function updateHUD(){
  scoreEl.textContent = score;
  waveEl.textContent = wave;
  ammoEl.textContent = reloading ? '···' : ammo;
  ammoBox.classList.toggle('low', !reloading && ammo <= 6);
  hpfill.style.width = Math.max(0,player.hp) + '%';
}

// ---- input ----
addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()]=true;
  if(e.key.toLowerCase()==='r') startReload();
});
addEventListener('keyup', e=> keys[e.key.toLowerCase()]=false);

function pointerPos(e){
  const rect = cv.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return {x:t.clientX-rect.left, y:t.clientY-rect.top};
}
cv.addEventListener('mousedown', e=>{mouse.down=true; Object.assign(mouse,pointerPos(e));});
cv.addEventListener('mousemove', e=> Object.assign(mouse,pointerPos(e)));
addEventListener('mouseup', ()=> mouse.down=false);

let touchAnchor=null;
cv.addEventListener('touchstart', e=>{e.preventDefault(); mouse.down=true;
  Object.assign(mouse,pointerPos(e)); touchAnchor={...pointerPos(e), px:player.x, py:player.y};},{passive:false});
cv.addEventListener('touchmove', e=>{e.preventDefault(); Object.assign(mouse,pointerPos(e));},{passive:false});
cv.addEventListener('touchend', e=>{e.preventDefault(); mouse.down=false; touchAnchor=null;},{passive:false});

// ---- mechanics ----
function startReload(){
  if(reloading || ammo===magSize) return;
  reloading=true; reloadT=90; // ~1.5s
}

function shoot(){
  const now=gameTime;
  if(reloading) return;
  if(ammo<=0){ startReload(); return; }
  if(now-lastShot < 5) return; // fire rate
  lastShot=now;
  ammo--;
  const spread=(Math.random()-0.5)*0.09;
  const a=player.angle+spread;
  bullets.push({x:player.x+Math.cos(a)*22, y:player.y+Math.sin(a)*22,
    vx:Math.cos(a)*11, vy:Math.sin(a)*11, life:60});
  // muzzle flash
  for(let i=0;i<4;i++) particles.push({x:player.x+Math.cos(a)*24,y:player.y+Math.sin(a)*24,
    vx:Math.cos(a)*3+(Math.random()-.5)*2, vy:Math.sin(a)*3+(Math.random()-.5)*2,
    life:8, c:'#ffcf6b', r:2.5});
  if(ammo<=0) startReload();
  updateHUD();
}

function spawnEnemy(){
  const edge=Math.floor(Math.random()*4);
  let x,y;
  if(edge===0){x=-20;y=Math.random()*H;}
  else if(edge===1){x=W+20;y=Math.random()*H;}
  else if(edge===2){x=Math.random()*W;y=-20;}
  else {x=Math.random()*W;y=H+20;}
  const hp = 2 + Math.floor(wave/3);
  enemies.push({x,y,r:13,hp,maxhp:hp,speed:1+Math.random()*0.6+wave*0.05});
}

function burst(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=1+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:20+Math.random()*15,c:color,r:1+Math.random()*3});
  }
}

// ---- update ----
function update(){
  gameTime++;

  // movement
  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])my-=1;
  if(keys['s']||keys['arrowdown'])my+=1;
  if(keys['a']||keys['arrowleft'])mx-=1;
  if(keys['d']||keys['arrowright'])mx+=1;
  if(touchAnchor){
    const dx=mouse.x-touchAnchor.x, dy=mouse.y-touchAnchor.y;
    if(Math.hypot(dx,dy)>14){mx=dx;my=dy;}
  }
  const len=Math.hypot(mx,my)||1;
  player.x+=(mx/len)*player.speed;
  player.y+=(my/len)*player.speed;
  player.x=Math.max(player.r,Math.min(W-player.r,player.x));
  player.y=Math.max(player.r,Math.min(H-player.r,player.y));

  player.angle=Math.atan2(mouse.y-player.y, mouse.x-player.x);

  if(mouse.down) shoot();

  if(reloading){ reloadT--; if(reloadT<=0){reloading=false; ammo=magSize; updateHUD();} }

  // spawn
  if(enemiesLeft>0){
    spawnTimer--;
    if(spawnTimer<=0){ spawnEnemy(); enemiesLeft--; spawnTimer=Math.max(18,50-wave*2); }
  } else if(enemies.length===0){ nextWave(); updateHUD(); }

  // bullets
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i]; b.x+=b.vx; b.y+=b.vy; b.life--;
    if(b.life<=0||b.x<-30||b.x>W+30||b.y<-30||b.y>H+30){bullets.splice(i,1);continue;}
    for(let j=enemies.length-1;j>=0;j--){
      const e=enemies[j];
      if((b.x-e.x)**2+(b.y-e.y)**2 < (e.r+3)**2){
        e.hp--; burst(b.x,b.y,'#d8a44a',5); bullets.splice(i,1);
        if(e.hp<=0){ enemies.splice(j,1); score+=10; burst(e.x,e.y,'#ff5b3c',14); updateHUD(); }
        break;
      }
    }
  }

  // enemies chase
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const a=Math.atan2(player.y-e.y,player.x-e.x);
    e.x+=Math.cos(a)*e.speed; e.y+=Math.sin(a)*e.speed;
    if((e.x-player.x)**2+(e.y-player.y)**2 < (e.r+player.r)**2){
      player.hp-=0.8; hpbar.style.transform=`translateX(${(Math.random()-.5)*4}px)`;
      updateHUD();
      if(player.hp<=0){ gameOver(); return; }
    }
  }

  // particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.x+=p.vx; p.y+=p.vy; p.vx*=0.92; p.vy*=0.92; p.life--;
    if(p.life<=0) particles.splice(i,1);
  }
}

// ---- draw ----
function draw(){
  ctx.clearRect(0,0,W,H);

  // particles under
  particles.forEach(p=>{
    ctx.globalAlpha=Math.max(0,p.life/25);
    ctx.fillStyle=p.c;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;

  // enemies
  enemies.forEach(e=>{
    ctx.save(); ctx.translate(e.x,e.y);
    if(enemyImgReady){
      const s=e.r*2.6;
      ctx.drawImage(enemyImg,-s/2,-s/2,s,s);
    } else {
      ctx.fillStyle='#5a2f3a'; ctx.strokeStyle='#ff5b3c'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(0,0,e.r,0,7); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#ff5b3c';
      ctx.beginPath(); ctx.arc(-4,-3,2,0,7); ctx.arc(4,-3,2,0,7); ctx.fill();
    }
    ctx.restore();
    if(e.hp<e.maxhp){
      ctx.fillStyle='#0008'; ctx.fillRect(e.x-e.r,e.y-e.r-7,e.r*2,3);
      ctx.fillStyle='#3fb6b2'; ctx.fillRect(e.x-e.r,e.y-e.r-7,e.r*2*(e.hp/e.maxhp),3);
    }
  });

  // bullets
  ctx.fillStyle='#ffe08a';
  bullets.forEach(b=>{ ctx.beginPath(); ctx.arc(b.x,b.y,3,0,7); ctx.fill(); });

  // player + gun
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.rotate(player.angle);
  // gun barrel
  ctx.fillStyle='#2b3440';
  ctx.fillRect(8,-3.5,26,7);
  ctx.fillStyle='#d8a44a';
  ctx.fillRect(14,3,8,7); // magazine
  ctx.fillStyle='#c7ced6';
  ctx.fillRect(30,-2,6,4); // muzzle
  ctx.rotate(-player.angle);
  // body
  if(playerImgReady){
    const s=player.r*2.6;
    ctx.drawImage(playerImg,-s/2,-s/2,s,s);
  } else {
    ctx.fillStyle='#2c333c'; ctx.strokeStyle='#3fb6b2'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(0,0,player.r,0,7); ctx.fill(); ctx.stroke();
  }
  ctx.restore();

  // reload ring
  if(reloading){
    ctx.strokeStyle='#3fb6b2'; ctx.lineWidth=3;
    ctx.beginPath();
    ctx.arc(player.x,player.y,player.r+8,-Math.PI/2, -Math.PI/2 + (1-reloadT/90)*Math.PI*2);
    ctx.stroke();
  }
}

function loop(){
  if(!running) return;
  update();
  if(!running) return;
  draw();
  requestAnimationFrame(loop);
}

function start(){
  reset();
  running=true;
  overlay.classList.add('hidden');
  hud.classList.remove('hidden');
  hpbar.classList.remove('hidden');
  hint.classList.remove('hidden');
  loop();
}

function gameOver(){
  running=false;
  hint.classList.add('hidden');
  overlay.innerHTML=`
    <h1>WAVE <span>${wave}</span></h1>
    <p class="big">Final score: ${score}</p>
    <p>You held out through ${wave} wave${wave>1?'s':''}. Try to push further.</p>
    <button id="rBtn">PLAY AGAIN</button>`;
  overlay.classList.remove('hidden');
  document.getElementById('rBtn').addEventListener('click', start);
}

startBtn.addEventListener('click', start);
</script>
</body>
</html>
